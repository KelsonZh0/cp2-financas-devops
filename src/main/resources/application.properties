spring.application.name=financas

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/financasdb?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fiap}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fiap123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true